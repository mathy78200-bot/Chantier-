name: chantiers
description: Suivi de rentabilité des chantiers — prévu vs réel, hors-ligne.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0

  # État / navigation
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1

  # Modèles
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0

  # Formatage (version épinglée par flutter_localizations)
  intl: any

  # Justificatifs (étape 8) et graphiques (étape 7)
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  connectivity_plus: ^7.3.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  fake_cloud_firestore: ^4.2.0

flutter:
  uses-material-design: true
